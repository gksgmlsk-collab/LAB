<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>돌 AI 연구소 — 인천석암초등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A33; --navy:#20344A; --steel:#3E5B73; --gold:#9A7B33;
    --paper:#FBFAF7; --panel:#FFFFFF; --soft:#EEF2F5; --line:#D5DDE3; --sub:#5D6E79;
    --blue:#256BA5; --green:#2F7A5B; --violet:#6454A3; --amber:#9A7B33; --muted:#6D7480; --rose:#8C5A58;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;font-size:15.5px;
  }
  a{color:inherit}
  .wrap{max-width:460px;margin:0 auto;padding:0 18px 52px}
  .doc-top{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 0 12px;border-bottom:2px solid var(--navy);
    font-size:12px;color:var(--sub);letter-spacing:.02em;
  }
  .doc-top .cls{color:var(--navy);font-weight:700}
  header{padding:26px 0 6px}
  h1{
    font-family:'Noto Serif KR',serif;font-weight:700;font-size:24px;
    line-height:1.42;color:var(--navy);word-break:keep-all;
  }
  .sub{font-size:14px;color:var(--sub);margin-top:8px;word-break:keep-all}
  .list{margin-top:24px;display:flex;flex-direction:column;gap:14px}
  a.card{
    display:block;text-decoration:none;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:18px 18px;
    transition:border-color .15s, transform .05s;
  }
  a.card:hover{border-color:var(--steel)}
  a.card:active{transform:translateY(1px)}
  a.card:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .ribbon{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;
    color:var(--gold);border:1px solid var(--gold);border-radius:4px;
    padding:3px 9px;margin-bottom:11px;
  }
  .card h2{
    font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;
    color:var(--navy);word-break:keep-all;line-height:1.4;
  }
  .card .desc{font-size:13.5px;color:#293842;margin-top:7px;word-break:keep-all}
  .card .go{
    display:flex;justify-content:flex-end;align-items:center;
    margin-top:12px;font-size:13px;font-weight:700;color:var(--steel);
  }
  .card .go .arw{font-size:18px;color:var(--gold);margin-left:6px}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  .lab-report{margin-top:34px}
  .lab-topline{border-top:2px solid var(--navy);padding-top:22px}
  .lab-label{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.12em;
    color:var(--gold);border:1px solid var(--gold);border-radius:4px;
    padding:4px 9px;margin-bottom:13px;
  }
  .lab-title{
    font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;
    color:var(--navy);line-height:1.42;word-break:keep-all;
  }
  .lab-lead{font-size:14.5px;color:#293842;margin-top:10px;word-break:keep-all}
  .lab-lead + .lab-lead{margin-top:7px}

  .lab-nav{
    margin-top:18px;display:flex;flex-wrap:wrap;gap:7px;
  }
  .lab-nav a{
    min-height:36px;display:inline-flex;align-items:center;
    text-decoration:none;background:var(--panel);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px;font-size:12.5px;font-weight:700;color:var(--steel);
  }
  .lab-nav a:focus-visible,
  .lab-link:focus-visible,
  .filter-btn:focus-visible{
    outline:2px solid var(--steel);outline-offset:2px;
  }

  .lab-section{margin-top:34px}
  .lab-section h2{
    font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;
    color:var(--navy);padding-bottom:9px;margin-bottom:14px;
    border-bottom:1px solid var(--line);word-break:keep-all;
  }
  .lab-section h2 .no{color:var(--gold);margin-right:8px}
  .lab-section h3{
    font-family:'Noto Serif KR',serif;font-size:16.5px;font-weight:700;
    color:var(--navy);line-height:1.42;word-break:keep-all;
  }
  .lab-body{color:#293842;word-break:keep-all}
  .lab-body + .lab-body{margin-top:8px}

  .lab-message-grid{display:grid;grid-template-columns:1fr;gap:9px;margin-top:16px}
  .lab-message-card,
  .lab-org-card,
  .lab-area-card,
  .lab-service-card,
  .lab-feature-card,
  .lab-principle-card,
  .lab-roadmap-card{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
  }
  .lab-message-card{padding:14px 14px}
  .lab-message-card .k{font-size:13.5px;font-weight:700;color:var(--navy);word-break:keep-all}
  .lab-message-card .v{font-size:13.5px;color:#293842;margin-top:4px;word-break:keep-all}

  .lab-flow{display:flex;flex-direction:column;gap:8px}
  .lab-step{
    display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:flex-start;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  }
  .lab-step .fn{
    width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .lab-step .fx b{display:block;color:var(--navy);font-size:13.8px;word-break:keep-all}
  .lab-step .fx span{display:block;font-size:13.5px;color:#293842;margin-top:2px;word-break:keep-all}

  .lab-org-list{display:flex;flex-direction:column;gap:9px}
  .lab-org-card{padding:14px 14px}
  .lab-org-card .role{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.03em}
  .lab-org-card .names{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--navy);margin-top:2px;word-break:keep-all}
  .lab-org-card .note{font-size:13.5px;color:#293842;margin-top:5px;word-break:keep-all}
  .lab-area-grid{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
  .lab-area-card{padding:14px 14px}
  .lab-area-card h3{font-size:15.5px}
  .lab-list{list-style:none;margin-top:8px}
  .lab-list li{
    position:relative;padding:7px 0 7px 18px;font-size:13.5px;color:#293842;
    border-bottom:1px dashed var(--line);word-break:keep-all;
  }
  .lab-list li:last-child{border-bottom:0}
  .lab-list li::before{content:"◦";position:absolute;left:1px;color:var(--steel)}
  .lab-note{
    margin-top:12px;padding:12px 14px;border:1px solid #E1C9BF;background:#F6EEE9;
    border-radius:9px;font-size:13px;color:#6E2E22;word-break:keep-all;
  }

  .lab-stage-list{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:12px}
  .lab-stage-row{display:grid;grid-template-columns:78px 1fr;gap:9px;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .lab-stage-row:nth-child(even){background:#F7F9FA}
  .lab-stage-row:last-child{border-bottom:0}
  .lab-stage-row b{font-size:12.5px;color:var(--steel)}
  .lab-stage-row span{font-size:13px;color:#293842;word-break:keep-all}

  .filter-bar{display:flex;flex-wrap:wrap;gap:7px;margin:17px 0 13px}
  .filter-btn{
    min-height:36px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
    color:var(--steel);font:inherit;font-size:12.5px;font-weight:700;padding:7px 10px;
    cursor:pointer;
  }
  .filter-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

  .lab-project-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .lab-service-card{padding:13px 13px;display:flex;flex-direction:column;gap:10px}
  .lab-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .lab-category{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.03em}
  .stage-badge{
    display:inline-flex;align-items:center;min-height:25px;border-radius:999px;
    padding:4px 8px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;
  }
  .stage-school{background:var(--blue)}
  .stage-improve{background:var(--green)}
  .stage-active{background:#276C6B}
  .stage-test{background:var(--amber)}
  .stage-demo{background:var(--violet)}
  .stage-idea{background:var(--muted)}
  .stage-hold{background:var(--rose)}
  .lab-service-card h3{font-size:16px}
  .lab-service-card p{font-size:13.5px;color:#293842;word-break:keep-all}
  .lab-access-note{
    padding:9px 10px;border-left:3px solid var(--gold);background:#FBF7EB;
    color:#59491F;font-size:12.5px;font-weight:700;word-break:keep-all;
  }
  .lab-owner{font-size:12.5px;color:var(--sub)}
  .lab-link-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
  .lab-link,
  .lab-disabled{
    min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:7px;padding:10px 12px;font-size:13px;font-weight:700;text-decoration:none;
  }
  .lab-link{background:var(--steel);color:#fff}
  .lab-disabled{background:var(--soft);color:var(--sub);border:1px solid var(--line)}

  .lab-feature-list{display:flex;flex-direction:column;gap:12px}
  .lab-feature-card{overflow:hidden}
  .lab-feature-media{
    position:relative;overflow:hidden;background:#101A24;
  }
  .lab-feature-media::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(10,18,26,.78) 0,rgba(10,18,26,.2) 48%,rgba(10,18,26,.08) 100%);
    pointer-events:none;
  }
  .lab-feature-media > img{
    width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:var(--soft);
    opacity:.78;
  }
  .lab-feature-media > img.is-portrait{
    aspect-ratio:auto;object-fit:contain;background:#07101B;
  }
  .lab-feature-media > img.is-contain{object-fit:contain;background:#F5F7F9}
  .lab-feature-media-title{
    position:absolute;z-index:1;left:16px;right:16px;bottom:14px;
    color:#fff;font-family:'Noto Serif KR',serif;font-size:23px;font-weight:700;
    line-height:1.25;letter-spacing:0;text-shadow:0 2px 8px rgba(0,0,0,.72);
    word-break:keep-all;
  }
  .lab-media-placeholder{
    min-height:112px;padding:16px;background:
      linear-gradient(135deg, rgba(32,52,74,.96), rgba(37,107,165,.78) 56%, rgba(154,123,51,.62));
    color:#fff;display:flex;flex-direction:column;justify-content:flex-end;
  }
  .lab-media-placeholder span{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#D9E7F2}
  .lab-media-placeholder strong{font-family:'Noto Serif KR',serif;font-size:20px;line-height:1.32;margin-top:4px;word-break:keep-all}
  .lab-feature-body{padding:14px 14px}
  .lab-feature-body h3{font-size:17px}
  .lab-feature-body p{font-size:13.8px;color:#293842;margin-top:6px;word-break:keep-all}
  .lab-report-point{
    margin-top:10px;border-left:3px solid var(--gold);padding:8px 0 8px 10px;
    font-size:13px;color:#293842;background:#FBF7EB;word-break:keep-all;
  }
  .lab-gallery{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .lab-gallery-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .lab-gallery-head strong{font-size:13px;color:var(--navy)}
  .lab-gallery-head span{font-size:11.5px;color:var(--sub)}
  .lab-gallery-strip{
    display:flex;gap:8px;overflow-x:auto;overscroll-behavior-inline:contain;
    padding:1px 1px 7px;scrollbar-width:thin;
  }
  .lab-gallery-thumb{
    flex:0 0 76px;width:76px;padding:0;overflow:hidden;cursor:pointer;
    border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--navy);
    font:inherit;text-align:left;
  }
  .lab-gallery-thumb img{
    width:100%;height:88px;display:block;object-fit:cover;object-position:50% 0;
    background:#10112C;
  }
  .lab-gallery-thumb span{
    display:block;min-height:40px;padding:6px;font-size:10.5px;font-weight:700;
    line-height:1.35;word-break:keep-all;
  }
  .lab-gallery-thumb:hover{border-color:var(--steel)}
  .lab-gallery-thumb:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .lab-gallery-dialog{
    width:min(900px,calc(100% - 24px));max-width:900px;margin:auto;padding:0;border:0;
    border-radius:8px;background:transparent;color:var(--ink);
  }
  .lab-gallery-dialog::backdrop{background:rgba(10,18,26,.78)}
  .lab-gallery-dialog-shell{
    overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:8px;
    background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.32);
  }
  .lab-gallery-dialog-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:56px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);
  }
  .lab-gallery-dialog-head > div{min-width:0}
  .lab-gallery-dialog-head strong{display:block;font-size:15px;color:var(--navy)}
  .lab-gallery-dialog-head span{display:block;margin-top:1px;font-size:12px;color:var(--sub)}
  .lab-gallery-icon{
    flex:0 0 42px;width:42px;height:42px;border:1px solid rgba(255,255,255,.28);
    border-radius:50%;background:rgba(16,26,36,.78);color:#fff;
    font:inherit;font-size:22px;line-height:1;cursor:pointer;
  }
  .lab-gallery-icon:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .lab-gallery-dialog-head .lab-gallery-icon{
    border-color:var(--line);background:var(--soft);color:var(--navy);
  }
  .lab-gallery-dialog-stage{
    position:relative;display:flex;align-items:center;justify-content:center;
    min-height:300px;padding:14px 62px;background:#0E102B;
  }
  .lab-gallery-dialog-stage img{
    display:block;max-width:100%;max-height:72vh;object-fit:contain;background:#0E102B;
  }
  .lab-gallery-prev,.lab-gallery-next{position:absolute;top:50%;transform:translateY(-50%)}
  .lab-gallery-prev{left:10px}
  .lab-gallery-next{right:10px}
  .lab-gallery-dialog-caption{
    min-height:48px;padding:13px 16px;font-size:13.5px;font-weight:700;color:var(--navy);
  }

  .lab-path{display:flex;flex-direction:column;gap:7px;margin-top:13px}
  .lab-path span{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;font-size:13.5px;font-weight:700;color:var(--steel);word-break:keep-all;
  }
  .lab-principle-grid,
  .lab-roadmap-grid{display:grid;grid-template-columns:1fr;gap:9px}
  .lab-principle-card,
  .lab-roadmap-card{padding:13px 14px}
  .lab-principle-card h3,
  .lab-roadmap-card h3{font-size:15.5px}
  .lab-principle-card p,
  .lab-roadmap-card p{font-size:13.5px;color:#293842;margin-top:5px;word-break:keep-all}
  .lab-roadmap-links{margin-top:12px}
  .lab-roadmap-links .lab-link{min-height:40px;padding:8px 10px}
  .lab-channel-list{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:13px}
  .lab-channel-row{display:grid;grid-template-columns:92px 1fr;gap:9px;padding:12px 13px;border-bottom:1px solid var(--line);background:var(--panel)}
  .lab-channel-row:nth-child(even){background:#F7F9FA}
  .lab-channel-row:last-child{border-bottom:0}
  .lab-channel-row b{font-size:12.5px;color:var(--steel)}
  .lab-channel-row span{font-size:13.5px;color:#293842;word-break:keep-all}
  .lab-closing{
    margin-top:14px;background:var(--navy);border-radius:10px;padding:17px 16px;color:#EAF0F4;
  }
  .lab-closing p{font-size:14px;line-height:1.72;word-break:keep-all}
  .lab-closing p + p{margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.14)}

  footer{
    margin-top:34px;padding-top:14px;border-top:2px solid var(--navy);
    font-size:11.5px;color:var(--sub);word-break:keep-all;line-height:1.55;
  }
  .back-link{
    display:inline-flex;align-items:center;min-height:44px;margin-bottom:12px;
    color:var(--steel);font-size:13px;font-weight:700;text-decoration:none;
  }
  .back-link:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .lab-page-nav{margin-top:18px;margin-bottom:34px}
  .lab-page-nav a{min-height:44px}
  .lab-page-nav + .lab-report{margin-top:0}
  .lab-intro-heading{margin-top:0}
  .lab-page-header{
    position:relative;min-height:0;padding-right:0;
  }
  .lab-heading-lockup{
    display:flex;align-items:center;gap:14px;
  }
  .lab-heading-copy{min-width:0}
  .lab-heading-copy .sub{margin-top:6px}
  .lab-header-mascot{
    position:static;flex:0 0 96px;width:96px;height:116px;
    overflow:visible;background:transparent;
  }
  .lab-header-mascot img{
    width:100%;height:100%;display:block;object-fit:contain;
    object-position:50% 50%;filter:drop-shadow(0 6px 7px rgba(27,42,51,.18));
  }

  @media (min-width:520px){
    .wrap{max-width:500px}
  }
  @media (min-width:820px){
    .wrap{max-width:1120px;padding:0 32px 76px}
    .doc-top{padding:20px 0 14px;font-size:13px}
    .lab-page-header{min-height:0;padding:34px 0 16px}
    .lab-page-header h1{font-size:34px}
    .lab-page-header .sub{font-size:16px}
    .lab-heading-lockup{gap:24px}
    .lab-header-mascot{flex-basis:146px;width:146px;height:166px}
    .lab-page-nav{gap:10px;margin:20px 0 48px}
    .lab-page-nav a{padding:9px 14px;font-size:13.5px}
    .lab-section{margin-top:56px}
    .lab-section h2{font-size:24px;margin-bottom:22px}
    .lab-title{font-size:30px}
    #lab-intro-content > .lab-lead{max-width:800px;font-size:15.5px}
    .lab-message-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:24px}
    .lab-message-card{padding:18px}
    .lab-feature-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .lab-feature-card{display:flex;flex-direction:column}
    .lab-feature-card.is-primary{
      grid-column:1 / -1;display:grid;
      grid-template-columns:minmax(280px,.72fr) minmax(0,1.55fr);
    }
    .lab-feature-card.is-primary .lab-media-placeholder{height:100%;min-height:100%}
    .lab-feature-card.is-primary .lab-feature-media{height:100%;min-height:100%}
    .lab-feature-card.is-primary .lab-feature-media > img.is-portrait{height:100%;min-height:100%}
    .lab-feature-card.is-primary .lab-feature-media-title{left:20px;right:20px;bottom:18px;font-size:28px}
    .lab-feature-card.is-primary .lab-feature-body{padding:24px}
    .lab-feature-card.is-primary .lab-feature-body h3{font-size:22px}
    .lab-feature-card.is-primary .lab-feature-body p{font-size:14.5px;line-height:1.76}
    .lab-feature-card.is-primary .lab-gallery-thumb{flex-basis:82px;width:82px}
    .lab-feature-card.is-primary .lab-gallery-thumb img{height:96px}
    .lab-feature-body{display:flex;flex:1;flex-direction:column;padding:18px}
    .lab-feature-body .lab-link-row{margin-top:auto!important;padding-top:14px}
    .lab-media-placeholder{min-height:150px}
    .lab-project-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .lab-service-card{padding:17px;min-height:270px}
    .filter-bar{gap:9px;margin:22px 0 16px}
    .filter-btn{min-height:44px;padding:9px 14px;font-size:13px}
    .lab-roadmap-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .lab-roadmap-card{padding:18px}
    .lab-org-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .lab-org-card{padding:18px}
    .lab-closing{padding:22px}
    footer{margin-top:54px}
  }
  @media (prefers-reduced-motion:no-preference){
    .lab-section{animation:fadeUp .45s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="doc-top">
    <span>인천석암초등학교</span>
    <span class="cls">교육감 보고용</span>
  </div>

  <header class="lab-page-header">
    <a class="back-link" href="/" aria-label="수상 보고 목록으로 돌아가기">← 수상 보고 목록</a>
    <div class="lab-heading-lockup">
      <div class="lab-header-mascot">
        <img src="./assets/dolbot-header.png" alt="돌 AI 연구소 마스코트 돌봇">
      </div>
      <div class="lab-heading-copy">
        <h1>돌 AI 연구소</h1>
        <p class="sub">학교의 문제를, AI로 해결합니다.</p>
      </div>
    </div>
  </header>

  <main>
    <nav class="lab-nav lab-page-nav" aria-label="돌 AI 연구소 섹션 바로가기">
      <a href="#lab-intro">연구소 소개</a>
      <a href="#lab-featured">대표 서비스</a>
      <a href="#lab-services">서비스 포트폴리오</a>
      <a href="#lab-future">향후 발전방향</a>
      <a href="#lab-organization">연구소 운영조직</a>
    </nav>

    <article class="lab-report" aria-label="돌 AI 연구소 운영 및 서비스 보고">
      <section id="lab-intro" class="lab-section lab-topline lab-intro-heading" aria-labelledby="lab-intro-title">
        <h2 id="lab-intro-title"><span class="no">0</span>연구소 소개</h2>
        <div class="lab-label" id="lab-intro-label"></div>
        <div id="lab-intro-content"></div>
      </section>

      <section id="lab-featured" class="lab-section" aria-labelledby="lab-featured-title">
        <h2 id="lab-featured-title"><span class="no">1</span>대표 서비스</h2>
        <div id="lab-feature-list" class="lab-feature-list"></div>
      </section>

      <section id="lab-services" class="lab-section" aria-labelledby="lab-services-title">
        <h2 id="lab-services-title"><span class="no">2</span>서비스 포트폴리오</h2>
        <div id="lab-services-lead"></div>
        <div id="filter-bar" class="filter-bar" aria-label="서비스 카테고리 필터"></div>
        <div id="lab-project-grid" class="lab-project-grid" aria-live="polite"></div>
      </section>

      <section id="lab-future" class="lab-section" aria-labelledby="lab-future-title">
        <h2 id="lab-future-title"><span class="no">3</span>향후 발전 방향</h2>
        <div id="lab-roadmap-content"></div>
      </section>

      <section id="lab-organization" class="lab-section" aria-labelledby="lab-org-title">
        <h2 id="lab-org-title"><span class="no">4</span>연구소 운영조직</h2>
        <div id="lab-org-list" class="lab-org-list"></div>
      </section>
    </article>
  </main>

  <footer>
    인천석암초등학교 돌AI연구소 — 인천광역시교육청 읽걷쓰AI 현장 구현 사례
  </footer>

</div>

<script src="./lab-data.js"></script>
<script src="./lab-page.js"></script>
<script type="text/plain" hidden>
  (function(){
    const data = window.labData;
    if (!data) return;

    const stageClassMap = {
      "학교 적용": "stage-school",
      "지속 개선": "stage-improve",
      "내부 테스트": "stage-test",
      "데모": "stage-demo",
      "아이디어": "stage-idea",
      "보류": "stage-hold"
    };

    const byId = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
    const escapeAttr = escapeHtml;
    const stageBadge = (stage) => `<span class="stage-badge ${stageClassMap[stage] || "stage-idea"}">${escapeHtml(stage)}</span>`;
    const externalAttrs = 'target="_blank" rel="noopener noreferrer"';

    function actionMarkup(action, fallbackLabel){
      const label = action && action.label ? action.label : fallbackLabel;
      if (action && action.url) {
        return `<a class="lab-link" href="${escapeAttr(action.url)}" ${externalAttrs}>${escapeHtml(label)} <span aria-hidden="true">→</span></a>`;
      }
      return `<span class="lab-disabled" aria-disabled="true">${escapeHtml(label || "상세 공개 예정")}</span>`;
    }

    function mediaMarkup(project){
      if (project.image) {
        return `<img src="${escapeAttr(project.image)}" alt="${escapeAttr(project.name)} 화면 이미지" loading="lazy">`;
      }
      return `<div class="lab-media-placeholder" role="img" aria-label="${escapeAttr(project.name)} 이미지 준비 중">
        <span>${escapeHtml(project.category)}</span>
        <strong>${escapeHtml(project.name)}</strong>
      </div>`;
    }

    byId("lab-intro-label").textContent = data.intro.label;
    byId("lab-intro-content").innerHTML = `
      <h2 class="lab-title">${escapeHtml(data.intro.title)}</h2>
      ${data.intro.body.map((body) => `<p class="lab-lead">${escapeHtml(body)}</p>`).join("")}
      <div class="lab-message-grid">
        ${data.intro.cards.map((card) => `
          <div class="lab-message-card">
            <div class="k">${escapeHtml(card.title)}</div>
            <div class="v">${escapeHtml(card.body)}</div>
          </div>
        `).join("")}
      </div>
    `;

    byId("lab-nav").innerHTML = data.nav
      .map((item) => `<a href="${escapeAttr(item.href)}">${escapeHtml(item.label)}</a>`)
      .join("");

    byId("lab-process-lead").textContent = data.sectionCopy.processLead;
    byId("lab-organization-lead").textContent = data.sectionCopy.organizationLead;
    byId("lab-services-lead").innerHTML = data.sectionCopy.servicesLead
      .map((body) => `<p class="lab-body">${escapeHtml(body)}</p>`)
      .join("");
    byId("lab-safety-lead").textContent = data.sectionCopy.safetyLead;

    byId("lab-process-flow").innerHTML = data.process
      .map((step, index) => `
        <div class="lab-step">
          <span class="fn">${index + 1}</span>
          <span class="fx"><b>${escapeHtml(step.title)}</b><span>${escapeHtml(step.body)}</span></span>
        </div>
      `).join("");

    byId("lab-org-list").innerHTML = data.organization.groups
      .map((group) => `
        <div class="lab-org-card">
          <div class="role">${escapeHtml(group.role)}</div>
          <div class="names">${escapeHtml(group.names)}</div>
          <div class="note">${escapeHtml(group.body)}</div>
        </div>
      `).join("");

    byId("lab-area-grid").innerHTML = data.organization.areas
      .map((area) => `
        <section class="lab-area-card" aria-label="${escapeAttr(area.title)}">
          <h3>${escapeHtml(area.title)}</h3>
          <ul class="lab-list">
            ${area.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </section>
      `).join("");

    const projects = data.projects;
    const totalCount = projects.length;
    const appliedCount = projects.filter((project) => ["학교 적용", "지속 개선"].includes(project.stage)).length;
    const demoCount = projects.filter((project) => project.stage === "데모").length;
    const ideaCount = projects.filter((project) => project.stage === "아이디어").length;

    byId("lab-kpis").innerHTML = [
      { number: totalCount, label: "전체 등록<br>프로젝트" },
      { number: appliedCount, label: "학교 적용 또는<br>지속 개선" },
      { number: demoCount, label: "데모<br>단계" },
      { number: ideaCount, label: "아이디어<br>단계" }
    ].map((kpi) => `
      <div class="lab-kpi">
        <div class="n">${kpi.number}<small>개</small></div>
        <div class="l">${kpi.label}</div>
      </div>
    `).join("");

    byId("lab-stage-list").innerHTML = data.stages
      .map((stage) => `
        <div class="lab-stage-row">
          <b>${escapeHtml(stage.name)}</b>
          <span>${escapeHtml(stage.body)}</span>
        </div>
      `).join("");

    function renderProjects(filter){
      const filtered = filter === "전체" ? projects : projects.filter((project) => project.category === filter);
      byId("lab-project-grid").innerHTML = filtered.map((project) => `
        <section class="lab-service-card" aria-label="${escapeAttr(project.name)}">
          <div class="lab-card-head">
            <span class="lab-category">${escapeHtml(project.category)}</span>
            ${stageBadge(project.stage)}
          </div>
          <h3>${escapeHtml(project.name)}</h3>
          <p>${escapeHtml(project.summary)}</p>
          <div class="lab-owner">${escapeHtml(project.ownerLabel || "개발 및 운영")} ${escapeHtml(project.owner)}</div>
          <div class="lab-link-row">
            ${project.url ? actionMarkup({ label: project.category === "홍보·운영" ? "채널 열기" : "서비스 체험", url: project.url }) : actionMarkup({ label: "상세 공개 예정", url: null })}
          </div>
        </section>
      `).join("");
    }

    byId("filter-bar").innerHTML = data.filters
      .map((filter, index) => `<button class="filter-btn" type="button" aria-pressed="${index === 0 ? "true" : "false"}" data-filter="${escapeAttr(filter)}">${escapeHtml(filter)}</button>`)
      .join("");
    byId("filter-bar").addEventListener("click", (event) => {
      const button = event.target.closest(".filter-btn");
      if (!button) return;
      byId("filter-bar").querySelectorAll(".filter-btn").forEach((item) => item.setAttribute("aria-pressed", "false"));
      button.setAttribute("aria-pressed", "true");
      renderProjects(button.dataset.filter);
    });
    renderProjects("전체");

    byId("lab-feature-list").innerHTML = projects
      .filter((project) => project.featured)
      .map((project) => `
        <section class="lab-feature-card" aria-label="${escapeAttr(project.name)} 대표 서비스">
          ${mediaMarkup(project)}
          <div class="lab-feature-body">
            <div class="lab-card-head">
              <span class="lab-category">${escapeHtml(project.category)}</span>
              ${stageBadge(project.stage)}
            </div>
            <h3>${escapeHtml(project.name)}: ${escapeHtml(project.detailTitle)}</h3>
            <p>${escapeHtml(project.detailBody)}</p>
            <div class="lab-report-point">${escapeHtml(project.reportPoint)}</div>
            <div class="lab-link-row" style="margin-top:12px">
              ${project.actions.map((action) => actionMarkup(action, "서비스 체험")).join("")}
            </div>
          </div>
        </section>
      `).join("");

    byId("lab-demo-content").innerHTML = `
      <h3>${escapeHtml(data.demoLab.title)}</h3>
      <p class="lab-body" style="margin-top:8px">${escapeHtml(data.demoLab.body)}</p>
      <ul class="lab-list">
        ${data.demoLab.principles.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
      </ul>
      <div class="lab-path" aria-label="데모랩 성장 경로">
        ${data.demoLab.path.map((item) => `<span>${escapeHtml(item)}</span>`).join("")}
      </div>
    `;

    byId("lab-club-content").innerHTML = `
      <h3>${escapeHtml(data.studentClub.title)}</h3>
      <p class="lab-body" style="margin-top:8px">${escapeHtml(data.studentClub.body)}</p>
      <ul class="lab-list">
        ${data.studentClub.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
      </ul>
    `;

    byId("lab-principle-grid").innerHTML = data.safetyPrinciples
      .map((principle) => `
        <section class="lab-principle-card" aria-label="${escapeAttr(principle.title)}">
          <h3>${escapeHtml(principle.title)}</h3>
          <p>${escapeHtml(principle.body)}</p>
        </section>
      `).join("");

    byId("lab-diffusion-content").innerHTML = `
      <h3>${escapeHtml(data.diffusion.title)}</h3>
      <p class="lab-body" style="margin-top:8px">${escapeHtml(data.diffusion.body)}</p>
      <div class="lab-channel-list">
        ${data.diffusion.channels.map((channel) => `
          <div class="lab-channel-row">
            <b>${escapeHtml(channel.name)}</b>
            <span>${escapeHtml(channel.body)}</span>
          </div>
        `).join("")}
      </div>
      <div class="lab-link-row" style="margin-top:13px">
        ${data.diffusion.links.map((link) => actionMarkup({ label: `${link.label} 열기`, url: link.url }, "채널 열기")).join("")}
      </div>
    `;

    byId("lab-roadmap-content").innerHTML = `
      <h3>${escapeHtml(data.roadmap.title)}</h3>
      <div class="lab-roadmap-grid" style="margin-top:12px">
        ${data.roadmap.directions.map((direction, index) => `
          <section class="lab-roadmap-card" aria-label="방향 ${index + 1}. ${escapeAttr(direction.title)}">
            <h3>방향 ${index + 1}. ${escapeHtml(direction.title)}</h3>
            <p>${escapeHtml(direction.body)}</p>
          </section>
        `).join("")}
      </div>
      <div class="lab-closing">
        ${data.roadmap.closing.map((text) => `<p>${escapeHtml(text)}</p>`).join("")}
      </div>
    `;
  })();
</script>
</body>
</html>
